<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B6Tok Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: #0a0a12;
            color: #fff; 
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header a { color: #e94560; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        #control-mode {
            padding: 5px 10px;
            background: #0a0a12;
            color: #e94560;
            border: 1px solid #e94560;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* EMULATOR SCREEN */
        #game-canvas { 
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            flex: 1;
            background: #000;
            position: relative;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        
        canvas { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
        
        /* DEBUG PANEL */
        #debug-panel {
            position: fixed;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 5px 10px;
            font-size: 10px;
            border-radius: 4px;
            font-family: monospace;
            z-index: 999;
            display: none;
        }
        
        /* VIRTUAL ROM SELECTOR UI */
        #rom-selector {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(20,20,40,0.95) 0%, rgba(10,10,20,0.98) 100%);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 10;
        }
        
        .selector-header {
            color: #e94560;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #rom-list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .rom-item {
            padding: 12px 15px;
            margin: 4px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .rom-item.selected {
            background: #e94560;
            color: #fff;
            font-weight: bold;
            transform: scale(1.02);
        }

        .rom-item.selected::before { content: '▶ '; margin-right: 8px; }

        /* CONTROLS AREA */
        .controls-container {
            flex: 1;
            background: #0f0f1b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-top: 2px solid #16213e;
            user-select: none;
        }
        
        /* D-PAD */
        .dpad { position: relative; width: 120px; height: 120px; }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #2a2d3a;
            border-radius: 8px;
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            box-shadow: 2px 2px 0 #000, inset -2px -2px 0 #222;
        }
        .dpad-btn.active { background: #00d9ff; color: #000; }
        .dpad-btn.up { top: 0; left: 40px; }
        .dpad-btn.down { bottom: 0; left: 40px; }
        .dpad-btn.left { top: 40px; left: 0; }
        .dpad-btn.right { top: 40px; right: 0; }

        .dpad-btn::after {
            content: '';
            width: 0; 
            height: 0; 
            border-style: solid;
            position: absolute;
        }

        .up::after {
            border-width: 0 7px 10px 7px;
            border-color: transparent transparent #555 transparent;
        }
        .down::after {
            border-width: 10px 7px 0 7px;
            border-color: #555 transparent transparent transparent;
        }
        .left::after {
            border-width: 7px 10px 7px 0;
            border-color: transparent #555 transparent transparent;
        }
        .right::after {
            border-width: 7px 0 7px 10px;
            border-color: transparent transparent transparent #555;
        }

        .dpad-btn.active::after { border-color: transparent transparent #000 transparent; }
        .dpad-btn.down.active::after { border-color: #000 transparent transparent transparent; }
        .dpad-btn.left.active::after { border-color: transparent #000 transparent transparent; }
        .dpad-btn.right.active::after { border-color: transparent transparent transparent #000; }
        
        /* CENTER BUTTONS */
        .center-btns { display: flex; flex-direction: column; gap: 10px; }
        .small-btn {
            padding: 6px 15px;
            background: #2a2d3a;
            border-radius: 15px;
            border: 2px solid #555;
            font-size: 9px;
            color: #888;
            font-weight: bold;
            box-shadow: 2px 2px 0 #000;
        }
        .small-btn.active { background: #e94560; color: #fff; }
        
        /* A-B BUTTONS */
        .ab-buttons { display: flex; gap: 10px; }
        .action-btn {
            width: 55px; height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            border: 4px solid;
            box-shadow: 3px 3px 0 #000, inset -3px -3px 0 rgba(0,0,0,0.5);
        }
        .action-btn.b { background: #c44; color: #fff; border-color: #e66; }
        .action-btn.a { background: #4c4; color: #000; border-color: #6e6;}
        .action-btn.active { opacity: 0.7; transform: scale(0.9); }

        #status { text-align: center; font-size: 12px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <a href="/">Trang chủ</a>
    <select id="control-mode">
        <option value="touch">Màn hình cảm ứng</option>
        <option value="keyboard">Bàn phím vật lý</option>
    </select>
</div>

<div id="debug-panel"></div>

<div id="game-canvas">
    <div id="rom-selector">
        <div class="selector-header">Chọn GAME</div>
        <div id="rom-list-container">
            <div id="status">Loading...</div>
        </div>
    </div>
</div>

<div class="controls-container">
    <div class="dpad">
        <div class="dpad-btn up" id="btn-up"></div>
        <div class="dpad-btn down" id="btn-down"></div>
        <div class="dpad-btn left" id="btn-left"></div>
        <div class="dpad-btn right" id="btn-right"></div>
    </div>
    
    <div class="center-btns">
        <div class="small-btn" id="btn-select">SELECT</div>
        <div class="small-btn" id="btn-start">START</div>
        <div class="small-btn" id="btn-back">QUIT</div>
    </div>
    
    <div class="ab-buttons">
        <div class="action-btn b" id="btn-b">B</div>
        <div class="action-btn a" id="btn-a">A</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
<script>
    /* ===============================
    GLOBAL STATE
    ================================ */
    let nes = null;
    let gameLoop = null;
    let gameLoaded = false;
    let loading = false;

    let romFiles = [];
    let selectedIndex = 0;

    let controlMode = 'touch'; // touch | keyboard
    let debugMode = false;

    /* ===============================
    DEBUG
    ================================ */
    function debugLog(msg) {
        if (!debugMode) return;
        const panel = document.getElementById('debug-panel');
        if (!panel) return;
        panel.style.display = 'block';
        panel.textContent = msg;
    }

    // bật debug khi nhấn phím 7 ba lần nhanh
    let debugKeyCount = 0;
    let debugTimeout = null;

    /* ===============================
    CONTROL MODE
    ================================ */
    const modeSelector = document.getElementById('control-mode');
    modeSelector.addEventListener('change', (e) => {
        controlMode = e.target.value;
        updateControlsVisibility();
        if (!gameLoaded) renderRomSelector();
    });

    function updateControlsVisibility() {
        const controls = document.querySelector('.controls-container');
        if (!controls) return;

        if (controlMode === 'keyboard' && !gameLoaded) {
            controls.style.display = 'none';
        } else {
            controls.style.display = 'flex';
        }
    }

    /* ===============================
    LOAD ROM LIST
    ================================ */
    async function loadRomList() {
        try {
            const res = await fetch('/api/roms');
            romFiles = await res.json();
            selectedIndex = 0;
            renderRomSelector();
        } catch (e) {
            document.getElementById('status').innerHTML = "API Error";
        }
    }

    function renderRomSelector() {
        updateControlsVisibility();

        const container = document.getElementById('rom-list-container');
        if (!container) return;

        if (romFiles.length === 0) {
            container.innerHTML = "<div style='text-align:center'>No ROMs found</div>";
            return;
        }

        const guide = controlMode === 'keyboard'
            ? `<div style="padding:10px;background:rgba(233,69,96,.2);border-radius:6px;margin-bottom:10px;font-size:10px">
                <b style="color:#e94560">PHÍM:</b><br>
                W/S ↑↓ = chọn<br>
                ENTER / 9 / 0 = START<br>
                <span style="font-size:9px;color:#aaa">Trong game: WASD | K/Z=A | L/X=B | Q=Quit</span><br>
                <span style="font-size:9px;color:#0f0">Bấm 7 x3 để bật DEBUG</span>
            </div>`
            : '';

        container.innerHTML =
            guide +
            romFiles.map((name, i) => `
                <div class="rom-item ${i === selectedIndex ? 'selected' : ''}"
                    onclick="selectedIndex=${i}; launch('${name}')">
                    ${name.replace('.nes','').toUpperCase()}
                </div>
            `).join('');

        const sel = container.querySelector('.selected');
        if (sel) sel.scrollIntoView({ block: 'nearest' });
    }

    /* ===============================
    QUIT GAME
    ================================ */
    function quitGame() {
        if (!gameLoaded) return;

        clearInterval(gameLoop);
        gameLoop = null;
        gameLoaded = false;
        nes = null;

        document.getElementById('game-canvas').innerHTML = `
            <div id="rom-selector">
                <div class="selector-header">CHỌN GAME</div>
                <div id="rom-list-container"></div>
            </div>`;

        renderRomSelector();
    }

    /* ===============================
    MENU INPUT
    ================================ */
    function handleMenuInput(btnId) {
        if (gameLoaded) return false;

        if (btnId === 'btn-up') {
            selectedIndex = (selectedIndex - 1 + romFiles.length) % romFiles.length;
            renderRomSelector();
            return true;
        }

        if (btnId === 'btn-down') {
            selectedIndex = (selectedIndex + 1) % romFiles.length;
            renderRomSelector();
            return true;
        }

        if (btnId === 'btn-start' || btnId === 'btn-a') {
            if (romFiles[selectedIndex]) launch(romFiles[selectedIndex]);
            return true;
        }

        return false;
    }

    /* ===============================
    BUTTON MAP
    ================================ */
    const BTN_MAP = {
        'btn-a': 0,
        'btn-b': 1,
        'btn-select': 2,
        'btn-start': 3,
        'btn-up': 4,
        'btn-down': 5,
        'btn-left': 6,
        'btn-right': 7,
        'btn-back': null
    };

    const KEYBOARD_MAP = {
        w:'btn-up', W:'btn-up', ArrowUp:'btn-up', '8':'btn-up',
        s:'btn-down', S:'btn-down', ArrowDown:'btn-down', '2':'btn-down',
        a:'btn-left', A:'btn-left', ArrowLeft:'btn-left', '4':'btn-left',
        d:'btn-right', D:'btn-right', ArrowRight:'btn-right', '6':'btn-right',

        k:'btn-a', K:'btn-a', z:'btn-a', Z:'btn-a', '1':'btn-a',
        l:'btn-b', L:'btn-b', x:'btn-b', X:'btn-b', '3':'btn-b',

        ' ':'btn-select', Shift:'btn-select', '5':'btn-select',
        Enter:'btn-start', '9':'btn-start', '0':'btn-start',

        q:'btn-back', Q:'btn-back', Escape:'btn-back'
    };

    const pressedKeys = new Map();

    /* ===============================
    SIMULATE PRESS (BlackBerry)
    ================================ */
    function simulateButtonPress(btnId) {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        if (pressedKeys.has(btnId)) {
            clearTimeout(pressedKeys.get(btnId));
        }

        btn.classList.add('active');

        if (btnId === 'btn-back') {
            quitGame();
            return;
        }

        if (!handleMenuInput(btnId) && gameLoaded && nes && BTN_MAP[btnId] !== null) {
            nes.buttonDown(1, BTN_MAP[btnId]);
            debugLog(`DOWN ${BTN_MAP[btnId]}`);
        }

        const timeout = setTimeout(() => {
            btn.classList.remove('active');
            if (gameLoaded && nes && BTN_MAP[btnId] !== null) {
                nes.buttonUp(1, BTN_MAP[btnId]);
                debugLog(`UP ${BTN_MAP[btnId]}`);
            }
            pressedKeys.delete(btnId);
        }, 250);

        pressedKeys.set(btnId, timeout);
    }

    /* ===============================
    KEYBOARD HANDLER (ONE PLACE)
    ================================ */
    document.addEventListener('keypress', (e) => {
        // DEBUG TOGGLE
        if (e.key === '7') {
            debugKeyCount++;
            clearTimeout(debugTimeout);
            debugTimeout = setTimeout(() => debugKeyCount = 0, 800);
            if (debugKeyCount >= 3) {
                debugMode = !debugMode;
                debugKeyCount = 0;
                debugLog('DEBUG MODE ON');
            }
            return;
        }

        if (controlMode !== 'keyboard') return;

        debugLog(`KeyPress ${e.key}`);

        const btnId = KEYBOARD_MAP[e.key];
        if (!btnId) return;

        e.preventDefault();
        simulateButtonPress(btnId);
    });

    // fallback desktop
    document.addEventListener('keydown', (e) => {
        if (controlMode !== 'keyboard') return;

        const btnId = KEYBOARD_MAP[e.key];
        if (!btnId || pressedKeys.has(btnId)) return;

        e.preventDefault();
        pressedKeys.set(btnId, true);

        const btn = document.getElementById(btnId);
        if (btn) btn.classList.add('active');

        if (btnId === 'btn-back') return quitGame();

        if (!handleMenuInput(btnId) && gameLoaded && nes && BTN_MAP[btnId] !== null) {
            nes.buttonDown(1, BTN_MAP[btnId]);
        }
    });

    document.addEventListener('keyup', (e) => {
        if (controlMode !== 'keyboard') return;

        const btnId = KEYBOARD_MAP[e.key];
        if (!btnId) return;

        e.preventDefault();
        pressedKeys.delete(btnId);

        const btn = document.getElementById(btnId);
        if (btn) btn.classList.remove('active');

        if (gameLoaded && nes && BTN_MAP[btnId] !== null) {
            nes.buttonUp(1, BTN_MAP[btnId]);
        }
    });

    /* ===============================
    TOUCH / MOUSE
    ================================ */
    Object.keys(BTN_MAP).forEach(btnId => {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        const down = e => {
            e.preventDefault();
            btn.classList.add('active');

            if (btnId === 'btn-back') return quitGame();

            if (!handleMenuInput(btnId) && gameLoaded && nes && BTN_MAP[btnId] !== null) {
                nes.buttonDown(1, BTN_MAP[btnId]);
            }
        };

        const up = e => {
            e.preventDefault();
            btn.classList.remove('active');
            if (gameLoaded && nes && BTN_MAP[btnId] !== null) {
                nes.buttonUp(1, BTN_MAP[btnId]);
            }
        };

        btn.addEventListener('touchstart', down, { passive:false });
        btn.addEventListener('touchend', up, { passive:false });
        btn.addEventListener('mousedown', down);
        btn.addEventListener('mouseup', up);
    });

    /* ===============================
    LAUNCH GAME
    ================================ */
    function launch(romName) {
        if (loading) return;
        loading = true;

        updateControlsVisibility();

        const container = document.getElementById('game-canvas');
        container.innerHTML = '<canvas width="256" height="240"></canvas>';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = [];

        nes = new jsnes.NES({
            onFrame(frame) {
                if (!gameLoaded) return;
                const canvas = container.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                const img = ctx.getImageData(0,0,256,240);
                for (let i=0;i<frame.length;i++){
                    img.data[i*4]   = frame[i]&255;
                    img.data[i*4+1] = (frame[i]>>8)&255;
                    img.data[i*4+2] = (frame[i]>>16)&255;
                    img.data[i*4+3] = 255;
                }
                ctx.putImageData(img,0,0);
            },
            onAudioSample(l,r){
                audioBuffer.push(l,r);
                if (audioBuffer.length>=4096){
                    const buf=audioCtx.createBuffer(2,2048,44100);
                    for(let i=0;i<2048;i++){
                        buf.getChannelData(0)[i]=audioBuffer[i*2];
                        buf.getChannelData(1)[i]=audioBuffer[i*2+1];
                    }
                    const src=audioCtx.createBufferSource();
                    src.buffer=buf;
                    src.connect(audioCtx.destination);
                    src.start();
                    audioBuffer=[];
                }
            }
        });

        const xhr = new XMLHttpRequest();
        xhr.open("GET", '/roms/' + romName);
        xhr.overrideMimeType("text/plain; charset=x-user-defined");
        xhr.onload = function(){
            if(this.status===200){
                audioCtx.resume();
                nes.loadROM(this.responseText);
                gameLoaded = true;
                loading = false;
                gameLoop = setInterval(()=>nes.frame(),17);
            }
        };
        xhr.send();
    }

    loadRomList();
</script>

</body>
</html>
