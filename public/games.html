<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B6Tok Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: #0a0a12;
            color: #fff; 
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header { 
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header a { color: #e94560; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        #control-mode {
            padding: 5px 10px;
            background: #0a0a12;
            color: #e94560;
            border: 1px solid #e94560;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* EMULATOR SCREEN */
        #game-canvas { 
            width: 100%;
            max-width: 100%;
            flex: 1;
            background: #000;
            position: relative;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        
        canvas { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
        
        /* VIRTUAL ROM SELECTOR UI */
        #rom-selector {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(20,20,40,0.95) 0%, rgba(10,10,20,0.98) 100%);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 10;
        }
        
        .selector-header {
            color: #e94560;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #rom-list-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .rom-item {
            padding: 12px 15px;
            margin: 4px 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .rom-item.selected {
            background: #e94560;
            color: #fff;
            font-weight: bold;
            transform: scale(1.02);
        }

        .rom-item.selected::before { content: '▶ '; margin-right: 8px; }

        /* CONTROLS AREA */
        .controls-container {
            flex: 1;
            background: #0f0f1b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-top: 2px solid #16213e;
            user-select: none;
        }
        
        /* D-PAD */
        .dpad { position: relative; width: 120px; height: 120px; }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #2a2d3a;
            border-radius: 8px;
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            box-shadow: 2px 2px 0 #000, inset -2px -2px 0 #222;
        }
        .dpad-btn.active { background: #00d9ff; color: #000; }
        .dpad-btn.up { top: 0; left: 40px; }
        .dpad-btn.down { bottom: 0; left: 40px; }
        .dpad-btn.left { top: 40px; left: 0; }
        .dpad-btn.right { top: 40px; right: 0; }

        .dpad-btn::after {
            content: '';
            width: 0; 
            height: 0; 
            border-style: solid;
            position: absolute;
        }

        .up::after {
            border-width: 0 7px 10px 7px;
            border-color: transparent transparent #555 transparent;
        }
        .down::after {
            border-width: 10px 7px 0 7px;
            border-color: #555 transparent transparent transparent;
        }
        .left::after {
            border-width: 7px 10px 7px 0;
            border-color: transparent #555 transparent transparent;
        }
        .right::after {
            border-width: 7px 0 7px 10px;
            border-color: transparent transparent transparent #555;
        }

        .dpad-btn.active::after { border-color: transparent transparent #000 transparent; }
        .dpad-btn.down.active::after { border-color: #000 transparent transparent transparent; }
        .dpad-btn.left.active::after { border-color: transparent #000 transparent transparent; }
        .dpad-btn.right.active::after { border-color: transparent transparent transparent #000; }
        
        /* CENTER BUTTONS */
        .center-btns { display: flex; flex-direction: column; gap: 10px; }
        .small-btn {
            padding: 6px 15px;
            background: #2a2d3a;
            border-radius: 15px;
            border: 2px solid #555;
            font-size: 9px;
            color: #888;
            font-weight: bold;
            box-shadow: 2px 2px 0 #000;
        }
        .small-btn.active { background: #e94560; color: #fff; }
        
        /* A-B BUTTONS */
        .ab-buttons { display: flex; gap: 10px; }
        .action-btn {
            width: 55px; height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            border: 4px solid;
            box-shadow: 3px 3px 0 #000, inset -3px -3px 0 rgba(0,0,0,0.5);
        }
        .action-btn.b { background: #c44; color: #fff; border-color: #e66; }
        .action-btn.a { background: #4c4; color: #000; border-color: #6e6;}
        .action-btn.active { opacity: 0.7; transform: scale(0.9); }

        #status { text-align: center; font-size: 12px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <a href="/">Trang chủ</a>
    <select id="control-mode">
        <option value="touch">Màn hình cảm ứng</option>
        <option value="keyboard">Bàn phím vật lý</option>
    </select>
</div>

<div id="game-canvas">
    <div id="rom-selector">
        <div class="selector-header">Chọn GAME</div>
        <div id="rom-list-container">
            <div id="status">Loading...</div>
        </div>
    </div>
</div>

<div class="controls-container">
    <div class="dpad">
        <div class="dpad-btn up" id="btn-up"></div>
        <div class="dpad-btn down" id="btn-down"></div>
        <div class="dpad-btn left" id="btn-left"></div>
        <div class="dpad-btn right" id="btn-right"></div>
    </div>
    
    <div class="center-btns">
        <div class="small-btn" id="btn-select">SELECT</div>
        <div class="small-btn" id="btn-start">START</div>
        <div class="small-btn" id="btn-back">QUIT</div>
    </div>
    
    <div class="ab-buttons">
        <div class="action-btn b" id="btn-b">B</div>
        <div class="action-btn a" id="btn-a">A</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.1/jsnes.min.js"></script>
<script>
    let nes = null;
    let gameLoop = null;
    let gameLoaded = false;
    let romFiles = [];
    let selectedIndex = 0;
    let controlMode = 'touch'; // Mặc định là touch

    // LẤY CHỂ ĐỘ ĐIỀU KHIỂN
    const modeSelector = document.getElementById('control-mode');
    modeSelector.addEventListener('change', (e) => {
        controlMode = e.target.value;
        updateControlsVisibility();
        if (!gameLoaded) {
            renderRomSelector(); // Render lại danh sách khi đổi chế độ
        }
    });

    function updateControlsVisibility() {
        const controlsContainer = document.querySelector('.controls-container');
        if (controlMode === 'keyboard' && !gameLoaded) {
            controlsContainer.style.display = 'none';
        } else {
            controlsContainer.style.display = 'flex';
        }
    }

    // 1. LOAD DANH SÁCH GAME
    async function loadRomList() {
        try {
            const res = await fetch('/api/roms');
            romFiles = await res.json();
            renderRomSelector();
        } catch (e) {
            document.getElementById('status').innerHTML = "API Error";
        }
    }

    function renderRomSelector() {
        updateControlsVisibility();
        
        const container = document.getElementById('rom-list-container');
        if (romFiles.length === 0) {
            container.innerHTML = "<div style='text-align:center'>No ROMs found in /public/roms</div>";
            return;
        }
        
        // HƯỚNG DẪN PHÍM (CHỈ HIỆN KHI DÙNG BÀN PHÍM VẬT LÝ)
        const guide = controlMode === 'keyboard' ? `<div style='padding:10px; background:rgba(233,69,96,0.2); border-radius:6px; margin-bottom:10px; font-size:11px; line-height:1.6;'>
            <div style='color:#e94560; font-weight:bold; margin-bottom:5px;'>⌨️ HƯỚNG DẪN PHÍM:</div>
            <div>W/S = Di chuyển | ENTER = Chọn game</div>
        </div>` : '';
        
        container.innerHTML = guide + romFiles.map((name, index) => `
            <div class="rom-item ${index === selectedIndex ? 'selected' : ''}" 
                 onclick="selectedIndex=${index}; launch('${name}')">
                ${name.replace('.nes', '').toUpperCase()}
            </div>
        `).join('');
        
        const selected = container.querySelector('.selected');
        if (selected) selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function quitGame() {
        if (gameLoaded) {
            clearInterval(gameLoop);
            gameLoop = null;
            gameLoaded = false;
            nes = null; 

            document.getElementById('game-canvas').innerHTML = `
                <div id="rom-selector">
                    <div class="selector-header">CHỌN GAME</div>
                    <div id="rom-list-container"></div>
                </div>`;
            
            renderRomSelector();
        }
    }

    // 2. LOGIC MENU (CHỈ CHẠY KHI CHƯA VÀO GAME)
    function handleMenuInput(btnId) {
        if (gameLoaded) return false;
        if (btnId === 'btn-up') {
            selectedIndex = (selectedIndex - 1 + romFiles.length) % romFiles.length;
            renderRomSelector();
            return true;
        }
        if (btnId === 'btn-down') {
            selectedIndex = (selectedIndex + 1) % romFiles.length;
            renderRomSelector();
            return true;
        }
        if (btnId === 'btn-start' || btnId === 'btn-a') {
            if (romFiles[selectedIndex]) launch(romFiles[selectedIndex]);
            return true;
        }
        return false;
    }

    // 3. KHỞI TẠO ĐIỀU KHIỂN
    const BTN_MAP = { 
        'btn-a': 0, 
        'btn-b': 1, 
        'btn-select': 2, 
        'btn-start': 3, 
        'btn-up': 4, 
        'btn-down': 5, 
        'btn-left': 6, 
        'btn-right': 7, 
        'btn-back': null 
    };

    // MAP PHÍM CỨNG CHO BLACKBERRY Q20 VÀ BÀN PHÍM VẬT LÝ
    const KEYBOARD_MAP = {
        'w': 'btn-up',           // w = Lên
        'W': 'btn-up',           // W = Lên
        's': 'btn-down',         // s = Xuống
        'S': 'btn-down',         // S = Xuống
        'a': 'btn-left',         // a = Trái
        'A': 'btn-left',         // A = Trái
        'd': 'btn-right',        // d = Phải
        'D': 'btn-right',        // D = Phải
        'Enter': 'btn-start',    // Enter = START
        'q': 'btn-back',         // q = QUIT
        'Q': 'btn-back',         // Q = QUIT
        'k': 'btn-a',            // k = A
        'K': 'btn-a',            // K = A
        'l': 'btn-b',            // l = B
        'L': 'btn-b',            // L = B
        ' ': 'btn-select'        // Space = SELECT
    };

    // XỬ LÝ BÀN PHÍM CỨNG (CHỈ KHI CHỌN CHỂ ĐỘ KEYBOARD)
    document.addEventListener('keydown', (e) => {
        if (controlMode !== 'keyboard') return; // Chỉ xử lý khi ở chế độ keyboard
        
        const btnId = KEYBOARD_MAP[e.key];
        if (!btnId) return;
        
        e.preventDefault();
        const btn = document.getElementById(btnId);
        if (!btn || btn.classList.contains('active')) return;
        
        btn.classList.add('active');

        if (btnId === 'btn-back') {
            quitGame();
            return;
        }

        if (!handleMenuInput(btnId) && gameLoaded && nes && BTN_MAP[btnId] !== null) {
            nes.buttonDown(1, BTN_MAP[btnId]);
        }
    });

    document.addEventListener('keyup', (e) => {
        if (controlMode !== 'keyboard') return; // Chỉ xử lý khi ở chế độ keyboard
        
        const btnId = KEYBOARD_MAP[e.key];
        if (!btnId) return;
        
        e.preventDefault();
        const btn = document.getElementById(btnId);
        if (!btn) return;
        
        btn.classList.remove('active');
        
        if (gameLoaded && nes && BTN_MAP[btnId] !== null) {
            nes.buttonUp(1, BTN_MAP[btnId]);
        }
    });

    // XỬ LÝ TOUCH/MOUSE (GIỮ NGUYÊN)
    Object.keys(BTN_MAP).forEach(btnId => {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        const onDown = (e) => {
            e.preventDefault();
            btn.classList.add('active');

            if (btnId === 'btn-back') {
                quitGame();
                return;
            }

            if (!handleMenuInput(btnId) && gameLoaded && nes) {
                nes.buttonDown(1, BTN_MAP[btnId]);
            }
        };

        const onUp = (e) => {
            e.preventDefault();
            btn.classList.remove('active');
            
            if (gameLoaded && nes && BTN_MAP[btnId] !== null) {
                nes.buttonUp(1, BTN_MAP[btnId]);
            }
        };

        btn.addEventListener('touchstart', onDown, { passive: false });
        btn.addEventListener('touchend', onUp, { passive: false });
        btn.addEventListener('mousedown', onDown);
        btn.addEventListener('mouseup', onUp);
    });

    // 4. HÀM CHẠY GAME
    function launch(romName) {
        updateControlsVisibility(); // Cập nhật hiển thị controls khi vào game
        
        const canvasContainer = document.getElementById('game-canvas');
        canvasContainer.innerHTML = '<canvas width="256" height="240"></canvas>';
        
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        let audioBuffer = [];

        nes = new jsnes.NES({
            onFrame: (frameBuffer) => {
                const canvas = canvasContainer.querySelector('canvas');
                if (!canvas || !gameLoaded) return;
                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, 256, 240);
                const pixels = imageData.data;
                for (let i = 0; i < frameBuffer.length; i++) {
                    const pixel = frameBuffer[i];
                    pixels[i * 4] = pixel & 0xFF;
                    pixels[i * 4 + 1] = (pixel >> 8) & 0xFF;
                    pixels[i * 4 + 2] = (pixel >> 16) & 0xFF;
                    pixels[i * 4 + 3] = 0xFF;
                }
                ctx.putImageData(imageData, 0, 0);
            },

            onAudioSample: (left, right) => {
                audioBuffer.push(left, right);
                if (audioBuffer.length >= 4096) {
                    const buffer = audioCtx.createBuffer(2, 2048, 44100);
                    buffer.getChannelData(0).set(audioBuffer.filter((_,i) => i%2===0));
                    buffer.getChannelData(1).set(audioBuffer.filter((_,i) => i%2!==0));
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    source.start();
                    audioBuffer = [];
                }
            }
        });

        const xhr = new XMLHttpRequest();
        xhr.open("GET", '/roms/' + romName);
        xhr.overrideMimeType("text/plain; charset=x-user-defined");
        xhr.onload = function() {
            if (this.status === 200) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                nes.loadROM(this.responseText);
                gameLoaded = true;
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(() => {
                    if (gameLoaded && nes) nes.frame();
                }, 17);
            }
        };
        xhr.send();
    }

    loadRomList();
</script>
</body>
</html>
